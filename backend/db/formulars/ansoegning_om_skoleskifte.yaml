      '#states':
        visible:
          ':input[name="foraeldremyndighedsindehaver_2_cpr_nummer"]':
            filled: true
      '#attributes':
        style: 'background-color: #FFF4CC; border: 1px solid #FFD54F; color: #5C4400; ``'
      markup_oplysning_til_foaeldremyndighed:
        '#type': markup
        '#markup': '<p><strong>Der er registreret en anden forældremyndighedsindehaver på barnet, som vil modtage en kvittering ved indsendelse af formularen. Kvitteringen indeholder kun oplysning om ønske om skoleskift - men der vil ikke fremgå adresse, ønsket skole, eller navn på hverken barn eller forældremyndighedsindehavere.</strong></p><p>Hvis du har spørgsmål til ovenstående, kan du kontakte Pladsanvisningen, Aarhus Kommune:</p><p><a href="https://post.borger.dk/send/2ea2e7ff-bad5-471d-a5c0-a63cbbd076d6/d28f3637-faa2-4d3d-bda9-2be57558ff2b//">Skriv sikkert til os (post.borger.dk)</a></p><p><a>Telefon: </a><a href="tel:89403560">89 40 22 22</a></p><p><strong>Åbningstider:</strong><br>Mandag: 09:00 – 11:00<br>Tirsdag: 09:00 – 11:00<br>Torsdag: 09:00 – 11:00</p>'
  erklaering_sektion:
    '#type': section
    '#title': Erklæring
    '#title_display': invisible
    '#attributes':
      style: 'background: #E5EFFA; padding: 25px;'
    '#format': container
    kommunen_vil_i_henhold_til_foraeldreansvarsloven_ss_3_goere_opma:
      '#type': radios
      '#title': 'Er der enighed mellem forældremyndighedsindehaverne?'
      '#options':
        Ja: Ja
        Nej: Nej
    enighed_mellem_foraeldre:
      '#type': fieldset
      '#title': 'Enighed mellem forældremyndighedsindehaverne'
      markup_enighed:
        '#type': markup
        '#markup': '<p>Kommunen vil i henhold til Forældreansvarsloven § 3 gøre opmærksom på ved ind- og udmeldelse i skole samt skolefritidsordning &nbsp;kræves enighed mellem forældrene.</p>'
    der_er_ikke_enighed_mellem_foraeldremyndighedsindehaverne:
      '#type': fieldset
      '#title': 'Der er ikke enighed mellem forældremyndighedsindehaverne'
      '#states':
        visible:
          ':input[name="kommunen_vil_i_henhold_til_foraeldreansvarsloven_ss_3_goere_opma"]':
            value: Nej
      '#attributes':
        style: 'background-color: #FFF4CC; border: 1px solid #FFD54F; color: #5C4400; ``'
      markup_03:
        '#type': markup
        '#markup': '<p>Der kan ikke ansøges om skoleskift, når der ikke er enighed mellem forældremyndighedsindehaverne. Begge forældremyndighedsindehavere skal være enige om skoleskiftet, før ansøgningen kan indsendes.</p>'
markup_01:
  '#type': markup
  '#markup': '<h5><strong>Oplysninger om anvendelse af persondata</strong></h5><p>Aarhus Kommune registrerer og bruger de personoplysninger, du sender til os. Du kan læse om vores behandling af personoplysninger i Børn og Unge på <a href="https://www.aarhus.dk/personoplysningerimbu" target="_blank">aarhus.dk/personoplysningerimbu</a> og specifikt om indskrivning på <a href="https://www.aarhus.dk/indskrivningimbu" target="_blank">aarhus.dk/indskrivningimbu</a>.</p>'
actions:
  '#type': webform_actions

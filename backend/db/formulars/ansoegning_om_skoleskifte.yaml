oplysninger_om_barnet:
  '#type': wizard_page
  '#title': 'Dig og barnet'
  obs:
    '#type': fieldset
    '#title': Information
    '#attributes':
      style: 'background-color: #FFF4CC; border: 1px solid #FFD54F; color: #5C4400; ``'
    markup_02:
      '#type': markup
      '#markup': '<p>Forældre bedes være opmærksomme på at ind- og udmeldelse af SFO skal ske digitalt via<a href="https://dinplads.dk/Auth/LoginAsCitizen/751"> Digital Pladsanvisning.&nbsp;</a></p><p>_________________________________________________________</p><p><strong>Valg af skole </strong>Vælger I ved indskrivning til skolegang eller under skoleforløbet en anden skole end distriktsskolen, herunder en privatskole, kan der ikke senere fremsættes krav om optagelse på distriktsskolen. Overflytning til distriktsskolen behandles efter reglerne om skoleskifte.</p>'
  section_dine_oplysninger:
    '#type': section
    '#title': 'Dine oplysninger'
    '#attributes':
      style: 'background: #E5EFFA; padding: 25px;'
    navn_mitid:
      '#type': os2forms_nemid_name
      '#title': Navn
      '#multiple': false
      '#readonly': true
    cpr_nummer_mitid:
      '#type': os2forms_nemid_cpr
      '#title': CPR-nummer
      '#multiple': false
      '#readonly': true
    adresse:
      '#type': os2forms_nemid_address
      '#title': Adresse
      '#multiple': false
      '#readonly': true
    telefonnummer:
      '#type': textfield
      '#title': Telefonnummer
      '#minlength': 8
      '#maxlength': 8
      '#international': true
      '#international_initial_country': DK
      '#international_preferred_countries':
        - DK
    emailadresse_login:
      '#type': email
      '#title': Emailadresse
  section_oplysninger_om_barnet:
    '#type': section
    '#title': 'Oplysninger om barnet'
    '#attributes':
      style: 'background: #E5EFFA; padding: 25px;'
    vaelg_barn:
      '#type': os2forms_nemid_children_select
      '#title': 'Vælg dit barn fra listen'
      '#states':
        disabled:
          ':input[name="mit_barn_kommer_ikke_frem_i_listen"]':
            checked: true
    mit_barn_kommer_ikke_frem_i_listen:
      '#type': checkbox
      '#title': 'Mit barn kommer ikke frem i listen'
      '#states':
        invisible:
          ':input[name="vaelg_barn"]':
            filled: true
    mit_har_ikke_et_cpr_nummer:
      '#type': checkbox
      '#title': 'Mit barn har ikke et cpr-nummer'
      '#states':
        invisible:
          ':input[name="vaelg_barn"]':
            filled: true
    ikke_cpr_nummer:
      '#type': fieldset
      '#title': 'Ikke cpr-nummer'
      '#title_display': invisible
      '#states':
        visible:
          ':input[name="mit_har_ikke_et_cpr_nummer"]':
            checked: true
      '#format': container
      markup_05:
        '#type': markup
        '#markup': '<p>Hvis dit barn ikke har et CPR-nummer, kan ansøgning om skoleskift ikke behandles via denne formular.</p><p>I stedet skal du benytte formularen: <a href="https://selvbetjening.aarhuskommune.dk/da/content/ansoegning-om-indmeldelse-i-modtagelsesklasse">Ansøgning om indmeldelse i modtagelsesklasse</a></p><p>&nbsp;</p>'
    barnets_oplysninger_mitid:
      '#type': container
      '#states':
        visible:
          ':input[name="vaelg_barn"]':
            filled: true
      barnets_navn_mitid:
        '#type': os2forms_mitid_child_name
        '#title': 'Barnets navn'
        '#multiple': false
        '#readonly': true
      cpr_nummer_barn_mitid:
        '#type': os2forms_mitid_child_cpr
        '#title': 'Barnets CPR-nummer'
        '#multiple': false
        '#readonly': true
      barnets_adresse_mitid:
        '#type': os2forms_mitid_child_address
        '#title': Adresse
        '#multiple': false
        '#readonly': true
      foraeldremyndighedsindehaver_2_cpr_nummer:
        '#type': os2forms_mitid_child_other_guardian
        '#title': 'Forældremyndighedsindehaver 2 CPR-nummer'
    barnets_oplysninger_manuelt:
      '#type': container
      '#states':
        visible:
          ':input[name="mit_barn_kommer_ikke_frem_i_listen"]':
            checked: true
      barnets_navn_manuelt:
        '#type': textfield
        '#title': 'Barnets navn'
        '#states':
          required:
            ':input[name="mit_barn_kommer_ikke_frem_i_listen"]':
              checked: true
      cpr_nummer_barn_manuelt:
        '#type': textfield
        '#title': 'Barnets CPR-nummer'
        '#input_mask': '9999999999'
        '#pattern': '^(?:(?:31(0[13578]|1[02])|30(0[13-9]|1[0-2])|(?:0[1-9]|1[0-9]|2[0-8])(0[1-9]|1[0-2])|2902(?:[02468][048]|[13579][26]))\d{2}-?\d{4})$'
        '#pattern_error': 'Angiv et korrekt cpr-nummer.'
        '#states':
          required:
            ':input[name="mit_barn_kommer_ikke_frem_i_listen"]':
              checked: true
      barnets_adresse_manuelt:
        '#type': os2forms_dawa_address
        '#title': 'Barnets folkeregisteradresse'
        '#states':
          required:
            ':input[name="mit_barn_kommer_ikke_frem_i_listen"]':
              checked: true

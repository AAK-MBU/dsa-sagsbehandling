  oplysninger_om_skoleskifte_sektion:
    '#type': section
    '#title': 'Oplysninger om skoleskift'
    '#attributes':
      style: 'background: #E5EFFA; padding: 25px;'
    soeger_i_skole_inden_for_eller_uden_for_skoledistriktet:
      '#type': radios
      '#title': 'Søger I skoleskift ifm. flytning?'
      '#options':
        Ja: Ja
        Nej: Nej
    container__flytning_info:
      '#type': container
      '#states':
        visible:
          ':input[name="soeger_i_skole_inden_for_eller_uden_for_skoledistriktet"]':
            value: Ja
      hvilken_adresse_flytter_i_til:
        '#type': os2forms_dawa_address
        '#title': 'Hvilken adresse flytter I til?'
        '#required': true
        '#states':
          visible:
            ':input[name="soeger_i_skole_inden_for_eller_uden_for_skoledistriktet"]':
              value: Ja
          invisible:
            ':input[name="vi_kender_endnu_ikke_adressen"]':
              checked: true
        '#remove_place_name': 0
        '#limit_by_municipality': '0751'
      gaeldende_fra_dato:
        '#type': date
        '#title': 'Hvornår flytter I til adressen?'
        '#required': true
        '#states':
          visible:
            ':input[name="soeger_i_skole_inden_for_eller_uden_for_skoledistriktet"]':
              value: Ja
          invisible:
            ':input[name="vi_kender_endnu_ikke_adressen"]':
              checked: true
      vi_kender_endnu_ikke_adressen:
        '#type': checkbox
        '#title': 'Vi kender endnu ikke adressen'
        '#states':
          invisible:
            ':input[name="hvilken_adresse_flytter_i_til"]':
              filled: true
          visible:
            ':input[name="soeger_i_skole_inden_for_eller_uden_for_skoledistriktet"]':
              value: Ja
    skoleaar_valg:
      '#type': radios
      '#title': 'Hvilket skoleår søger du skoleskift for?'
      '#options':
        indevaerende: 'Indeværende skoleår'
        kommende: 'Kommende skoleår'
      '#required': true
    du_soeger_skoleskift_for_skoleaaret:
      '#type': computed_twig
      '#title': 'Du søger skoleskift for skoleåret'
      '#states':
        visible:
          ':input[name="skoleaar_valg"]':
            checked: true
      '#template': |-
        {%- set m = "now"|date("n") -%}
        {%- set y = "now"|date("Y") -%}
        {%- set start = m >= 8 ? y : y - 1 -%}
        {%- if data.skoleaar_valg == "kommende" -%}{%- set start = start + 1 -%}{%- endif -%}
        {{ start }}/{{ start + 1 }}
      '#ajax': true
    modtagende_skole:
      '#type': remote_select_element
      '#title': 'Undertegnede ønsker skoleskift for mit/vores barn til'
      '#wrapper_attributes':
        style: 'width:32em'
      '#attributes':
        style: 'width:32em'
      '#endpoint': 'https://mbuweb.adm.aarhuskommune.dk/dataapi/entities?type=skoleemail'
      '#data_key': id
      '#data_value': value
      '#use_empty_option': true
      '#empty_option': Vælg
      '#use_select2': true
    er_der_soeskende_paa_denne_skole:
      '#type': radios
      '#title': 'Er der søskende på denne skole?'
      '#options':
        Ja: Ja
        Nej: Nej
    hvilket_klassetrin_soeskende:
      '#type': textfield
      '#title': 'I hvilken klasse?'
      '#description': '<p>F.eks. 5.A&nbsp;</p>'
      '#states':
        visible:
          ':input[name="er_der_soeskende_paa_denne_skole"]':
            value: Ja
    begrund_oenske_om_skoleskift:
      '#type': textarea
      '#title': 'Uddyb evt. ønske om skoleskift'

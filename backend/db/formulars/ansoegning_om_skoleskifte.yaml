oplysninger_om_skoleskifte:
  '#type': wizard_page
  '#title': Skoleskiftet
  oplysninger_om_barnets_modersmaal:
    '#type': section
    '#title': 'Oplysninger om barnets modersmål'
    '#attributes':
      style: 'background: #E5EFFA; padding: 15px 20px;'
    container_modersmaal_tea:
      '#type': container
      '#attributes':
        style: 'margin: 0; padding: 0;'
      registreret_modersmaal:
        '#type': remote_select_element
        '#title': 'Registreret modersmål'
        '#wrapper_attributes':
          style: 'display:none'
        '#endpoint': 'https://mbu-os2forms.adm.aarhuskommune.dk/os2forms/api/dsa/get_child_modersmaal/0101005003'
        '#data_key': value
        '#data_value': value
      markup_modersmaal_lis:
        '#type': computed_twig
        '#title': 'Barnets registrerede modersmål'
        '#title_display': invisible
        '#wrapper_attributes':
          style: 'margin-top: 0; margin-bottom: 8px;'
        '#template': |-
          {% set sprog = data.registreret_modersmaal|default('')|trim %}
          {% if sprog is not empty and sprog != 'None' and sprog != 'Kunne ikke finde barnets modersmaal' %}
            <p style="margin: 0 0 8px;">Dit barn er registreret i Børn og Unge med <strong>{{ sprog|escape }}</strong> som modersmål.</p>
          {% endif %}
        '#ajax': true
    container_modersmaal_manuelt:
      '#type': container
      '#attributes':
        style: 'margin: 0; padding: 0;'
      '#states':
        visible:
          - ':input[name="registreret_modersmaal"]':
              value: None
          - or
          - ':input[name="registreret_modersmaal"]':
              value: 'Kunne ikke finde barnets modersmaal'
          - or
          - ':input[name="mit_barn_kommer_ikke_frem_i_listen"]':
              checked: true
      markup_04:
        '#type': markup
        '#markup': '<p style="margin: 0 0 8px;">Et barns modersmål defineres ud fra hvilket sprog der på et modersmålslignende niveau er talt til og med barnet fra dets fødsel.</p>'

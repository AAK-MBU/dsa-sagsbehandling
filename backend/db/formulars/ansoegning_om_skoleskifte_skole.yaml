test_aftaledokument:
  '#type': wizard_page
  '#title': 'Ansøgning om skoleskift – fuld'
  visning_af_fuld_ansoegning:
    '#type': computed_twig
    '#title': 'Ansøgning om skoleskift – fuld'
    '#title_display': invisible
    '#mode': html
    '#template': |
      {% set manuelt_barn = data.mit_barn_kommer_ikke_frem_i_listen|default('') %}
      {% set barn_navn = data.barnets_navn_mitid|default('') %}
      {% set barn_cpr = data.cpr_nummer_barn_mitid|default('') %}
      {% set adresse_id = 'barnets_adresse_mitid' %}
      {% set adresse_label = 'Adresse' %}
      {% if manuelt_barn %}
        {% set barn_navn = data.barnets_navn_manuelt|default('') %}
        {% set barn_cpr = data.cpr_nummer_barn_manuelt|default('') %}
        {% set adresse_id = 'barnets_adresse_manuelt' %}
        {% set adresse_label = 'Barnets folkeregisteradresse' %}
      {% else %}
        {% if barn_navn is empty %}{% set barn_navn = data.barnets_navn_manuelt|default('') %}{% endif %}
        {% if barn_cpr is empty %}{% set barn_cpr = data.cpr_nummer_barn_manuelt|default('') %}{% endif %}
        {% if data.barnets_adresse_mitid|default('') is empty %}
          {% set adresse_id = 'barnets_adresse_manuelt' %}
          {% set adresse_label = 'Barnets folkeregisteradresse' %}
        {% endif %}
      {% endif %}
      {% set registreret = data.registreret_modersmaal|default('')|trim %}
      {% set har_registreret = registreret is not empty and registreret != 'None' and registreret != 'Kunne ikke finde barnets modersmaal' %}
      {% set foraelder_sprog = data.hvilket_sprog_er_barnets_modersmaal_01|default('') %}
      {% set skole_sprog = data.elevens_modersmaal|default('') %}
      {% set afgoerende_sprog = skole_sprog %}
      {% if har_registreret %}
        {% set afgoerende_sprog = registreret %}
      {% endif %}
      {% set vurdering = data.skolens_vurdering|default('') %}
      {% set tilflytter = vurdering == 'Barnet er tilflytter til skolens distrikt' %}
      {% set ledig_plads = vurdering == 'Skolen har jf. reglerne om det frie skolevalg ledig plads på den pågældende årgang' %}
      {% set er_dsm = registreret == 'Dansk' or skole_sprog == 'Dansk' %}
      {% set er_dsa = not er_dsm and (har_registreret or skole_sprog is not empty) %}
      {% set afslag_venteliste = vurdering == 'Skolen har jf. reglerne om det frie skolevalg ikke ledig plads på den pågældende årgang' %}
      {% set kan_optages = (tilflytter or ledig_plads) and er_dsm %}
      {% set til_puf = (tilflytter or ledig_plads) and er_dsa %}
      {% set anden_foraelder = data.foraeldremyndighedsindehaver_2_cpr_nummer|default('') is not empty or data.navn_foraeldre_2|default('') is not empty or data.adresse_foraeldre_2|default('') is not empty or data.telefonnummer_foraeldre_2|default('') is not empty or data.emailadresse_foraeldre_2|default('') is not empty %}

      <div id="skoleskifte-fuld">
        <style>
          #skoleskifte-fuld { font-family: Arial, sans-serif; font-size: 10pt; line-height: 1.35; color: #000; }
          #skoleskifte-fuld h2 { font-size: 14pt; text-align: center; margin: 0 0 16px; }
          #skoleskifte-fuld table { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 0 0 12px; }
          #skoleskifte-fuld th, #skoleskifte-fuld td { border: 1px solid #000; padding: 6px 8px; vertical-align: top; overflow-wrap: anywhere; word-wrap: break-word; }
          #skoleskifte-fuld th { background: #fff; text-align: center; font-size: 10pt; font-weight: bold; }
          #skoleskifte-fuld .label { display: block; font-size: 9pt; margin: 0 0 4px; }
          #skoleskifte-fuld .value { display: block; min-height: 14px; font-weight: normal; }
          #skoleskifte-fuld .tekst { font-weight: normal; }
          #skoleskifte-fuld tr { page-break-inside: avoid; }
          #skoleskifte-fuld thead { display: table-header-group; }
          @media print { #skoleskifte-fuld .skole { page-break-before: always; } }
        </style>

        <h2>Ansøgning om skoleskift i skoleåret {{ data.du_soeger_skoleskift_for_skoleaaret|default('')|escape }}</h2>

        <table>
          <thead><tr><th colspan="2">Barnet</th></tr></thead>
          <tbody>
            <tr>
              <td><span class="label">Barnets navn</span><span class="value">{{ barn_navn|escape }}</span></td>
              <td><span class="label">Barnets CPR-nummer</span><span class="value">{% if data.mit_har_ikke_et_cpr_nummer|default('') %}Barnet har ikke et CPR-nummer{% else %}{{ barn_cpr|escape }}{% endif %}</span></td>
            </tr>
            <tr><td colspan="2"><span class="label">{{ adresse_label|escape }}</span><span class="value">{{ webform_token('[webform_submission:values:' ~ adresse_id ~ ']', webform_submission)|striptags|escape }}</span></td></tr>
          </tbody>
        </table>

        <table>
          <thead><tr><th colspan="2">Elevens nuværende skoleforhold</th></tr></thead>
          <tbody>
            <tr>
              <td><span class="label">Nuværende kommune</span><span class="value">{{ data.nuvaerende_kommune|default('')|escape }}</span></td>
              <td><span class="label">Elevens nuværende skole</span><span class="value">{{ data.barnets_nuvaerende_skole|default('')|escape }}</span></td>
            </tr>
            <tr>
              <td><span class="label">Elevens nuværende skoletilbud</span><span class="value">{{ data.gaar_barnet_i_en_normal_klasse|default('')|escape }}</span></td>
              <td><span class="label">Nuværende klasse</span><span class="value">{{ data.nuvaerende_klasse|default('')|escape }}</span></td>
            </tr>
            {% if data.gaar_barnet_i_en_normal_klasse|default('') == 'Modtagelsesklasse' %}
            <tr><td colspan="2"><span class="label">Skolen har vurderet at mit barn kan udsluses fra modtagelsesklasse til almenklasse pr.</span><span class="value">{% if data.skolen_har_vurderet_at_mit_barn_kan_udsluses_fra_modtagelsesklas|default('') is not empty %}{{ data.skolen_har_vurderet_at_mit_barn_kan_udsluses_fra_modtagelsesklas|date('d-m-Y')|escape }}{% endif %}</span></td></tr>
            {% endif %}
          </tbody>
        </table>

        <table>
          <thead><tr><th colspan="2">Barnets modersmål</th></tr></thead>
          <tbody>
            {% if har_registreret %}
            <tr><td colspan="2"><span class="label">Barnets registrerede modersmål</span><span class="value">{{ registreret|escape }}</span></td></tr>
            {% endif %}
            {% if (not har_registreret or manuelt_barn) and foraelder_sprog is not empty %}
            <tr><td colspan="2"><span class="label">Jeg vurderer, at mit barns modersmål er</span><span class="value">{{ foraelder_sprog|escape }}</span></td></tr>
            {% endif %}
            {% if not har_registreret and foraelder_sprog is empty %}
            <tr><td colspan="2">Der er ikke oplyst et modersmål.</td></tr>
            {% endif %}
          </tbody>
        </table>

        <table>
          <thead>
            <tr><th colspan="2">Forældremyndighedsindehaver(e)</th></tr>
            <tr><th>Ansøger fra formular 1</th><th>Den anden forældremyndighedsindehaver</th></tr>
          </thead>
          <tbody>
            <tr>
              <td>
      {% if data.navn_mitid|default('') is not empty %}<p><span class="label">Navn</span><span class="value">{{ data.navn_mitid|default('')|escape }}</span></p>{% endif %}
      {% if data.cpr_nummer_mitid|default('') is not empty %}<p><span class="label">CPR-nummer</span><span class="value">{{ data.cpr_nummer_mitid|default('')|escape }}</span></p>{% endif %}
      {% if data.adresse|default('') is not empty %}<p><span class="label">Adresse</span><span class="value">{{ data.adresse|default('')|escape }}</span></p>{% endif %}
      {% if data.telefonnummer|default('') is not empty %}<p><span class="label">Telefonnummer</span><span class="value">{{ data.telefonnummer|default('')|escape }}</span></p>{% endif %}
      {% if data.emailadresse_login|default('') is not empty %}<p><span class="label">Emailadresse</span><span class="value">{{ data.emailadresse_login|default('')|escape }}</span></p>{% endif %}
              </td>
              <td>
                {% if anden_foraelder %}
      {% if data.navn_foraeldre_2|default('') is not empty %}<p><span class="label">Navn</span><span class="value">{{ data.navn_foraeldre_2|default('')|escape }}</span></p>{% endif %}
      {% if data.foraeldremyndighedsindehaver_2_cpr_nummer|default('') is not empty %}<p><span class="label">Forældremyndighedsindehaver 2 CPR-nummer</span><span class="value">{{ data.foraeldremyndighedsindehaver_2_cpr_nummer|default('')|escape }}</span></p>{% endif %}
      {% if data.adresse_foraeldre_2|default('') is not empty %}<p><span class="label">Adresse</span><span class="value">{{ data.adresse_foraeldre_2|default('')|escape }}</span></p>{% endif %}
      {% if data.telefonnummer_foraeldre_2|default('') is not empty %}<p><span class="label">Telefonnummer</span><span class="value">{{ data.telefonnummer_foraeldre_2|default('')|escape }}</span></p>{% endif %}
      {% if data.emailadresse_foraeldre_2|default('') is not empty %}<p><span class="label">Emailadresse</span><span class="value">{{ data.emailadresse_foraeldre_2|default('')|escape }}</span></p>{% endif %}
                {% else %}
                  <p>Der er ikke registreret en anden forældremyndighedsindehaver på barnet.</p>
                {% endif %}
              </td>
            </tr>
            {% if data.kommunen_vil_i_henhold_til_foraeldreansvarsloven_ss_3_goere_opma|default('') is not empty %}
            <tr><td colspan="2"><span class="label">Er der enighed mellem forældremyndighedsindehaverne?</span><span class="value">{{ data.kommunen_vil_i_henhold_til_foraeldreansvarsloven_ss_3_goere_opma|escape }}</span></td></tr>
            {% endif %}
          </tbody>
        </table>

        <table>
          <thead><tr><th colspan="2">Oplysninger om skoleskiftet</th></tr></thead>
          <tbody>
            <tr><td colspan="2"><span class="label">Undertegnede ønsker skoleskift for mit/vores barn til</span><span class="value">{{ webform_token('[webform_submission:values:modtagende_skole:html]', webform_submission)|striptags|escape }}</span></td></tr>
            {% if data.data.skolen_email_tekstelement|default('') is not empty %}
            <tr><td colspan="2"><span class="label">Skolens emailadresse</span><span class="value">{{ data.skolen_email_tekstelement|escape }}</span></td></tr>
            {% endif %}
            <tr>
              <td><span class="label">Du søger skoleskift for skoleåret</span><span class="value">{{ data.du_soeger_skoleskift_for_skoleaaret|default('')|escape }}</span></td>
              <td><span class="label">Søger I skoleskift ifm. flytning?</span><span class="value">{{ data.soeger_i_skole_inden_for_eller_uden_for_skoledistriktet|default('')|escape }}</span></td>
            </tr>
            {% if data.soeger_i_skole_inden_for_eller_uden_for_skoledistriktet|default('') == 'Ja' %}
              {% if data.vi_kender_endnu_ikke_adressen|default('') %}
              <tr><td colspan="2"><span class="label">Hvilken adresse flytter I til?</span><span class="value">Familien kender endnu ikke adressen.</span></td></tr>
              {% else %}
              <tr><td colspan="2"><span class="label">Hvilken adresse flytter I til?</span><span class="value">{{ webform_token('[webform_submission:values:hvilken_adresse_flytter_i_til]', webform_submission)|striptags|escape }}</span></td></tr>
                {% if data.gaeldende_fra_dato|default('') is not empty %}
                <tr><td colspan="2"><span class="label">Hvornår flytter I til adressen?</span><span class="value">{{ data.gaeldende_fra_dato|date('d-m-Y')|escape }}</span></td></tr>
                {% endif %}
              {% endif %}
            {% endif %}
            <tr><td colspan="2"><span class="label">Er der søskende på denne skole?</span><span class="value">{{ data.er_der_soeskende_paa_denne_skole|default('')|escape }}</span></td></tr>
            {% if data.er_der_soeskende_paa_denne_skole|default('') == 'Ja' %}
            <tr><td colspan="2"><span class="label">I hvilken klasse?</span><span class="value">{{ data.hvilket_klassetrin_soeskende|default('')|escape }}</span></td></tr>
            {% endif %}
            {% if data.begrund_oenske_om_skoleskift|default('') is not empty %}
            <tr><td colspan="2"><span class="label">Uddyb evt. ønske om skoleskift</span><span class="tekst">{{ data.begrund_oenske_om_skoleskift|escape|nl2br }}</span></td></tr>
            {% endif %}
          </tbody>
        </table>

        <table class="skole">
          <thead><tr><th colspan="2">Skolens vurdering og afgørelse</th></tr></thead>
          <tbody>
            {% if not har_registreret and foraelder_sprog is not empty and skole_sprog is not empty %}
            <tr><td colspan="2"><span class="label">Elevens modersmål</span><span class="value">{{ skole_sprog|escape }}</span></td></tr>
            {% endif %}
            <tr><td colspan="2"><span class="label">Skolens vurdering</span><span class="value">{% if vurdering is not empty %}{{ vurdering|escape }}{% else %}Ikke udfyldt endnu{% endif %}</span></td></tr>
            {% if kan_optages %}
            <tr><td colspan="2">Barnet har dansk som modersmål, og har dermed krav på optagelse</td></tr>
            <tr>
              <td><span class="label">Eleven kan optages i (klasse)</span><span class="value">{{ data.eleven_kan_optages_i_klasse|default('')|escape }}</span></td>
              <td><span class="label">Dato for start</span><span class="value">{% if data.dato_for_start|default('') is not empty %}{{ data.dato_for_start|date('d-m-Y')|escape }}{% endif %}</span></td>
            </tr>
            {% elseif til_puf %}
            <tr><td colspan="2">{% if tilflytter %}Barnet har dansk som andetsprog, og ansøgningen bliver derfor videresendt til PUF til afklaring af om barnet har et alderssvarende dansk sprog eller har et sprogstøttebehov{% else %}Barnet har dansk som andetsprog, og ansøgningen skal derfor videresendes til PUF til afklaring af om barnet har et alderssvarende dansk sprog eller har et sprogstøttebehov{% endif %}</td></tr>
            {% elseif afslag_venteliste %}
            <tr><td colspan="2"><p><strong>Afslag og venteliste</strong></p><p>Der er ikke ledig plads på den pågældende årgang. Forældrene skal have besked om afslag og venteliste.</p></td></tr>
            {% endif %}
          </tbody>
        </table>
      </div>
    '#ajax': false

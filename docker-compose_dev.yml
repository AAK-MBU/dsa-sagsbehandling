services:
  api:
    # Built by .github/workflows/docker-publish.yml — never on the server.
    # pull_policy always: the tag moves with each push, so `up -d` fetches it.
    image: ghcr.io/aak-mbu/dsa-sagsbehandling-api:${DSA_IMAGE_TAG:-develop}
    pull_policy: always
    container_name: dsa-api
    environment:
      API_KEY: ${API_KEY}
      API_KEY_HASHES: ${API_KEY_HASHES}
      # DSA: fails closed when unset — see OIDC_ENABLED in .env.example.
      OIDC_ENABLED: ${OIDC_ENABLED:-true}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      # DSA: empty for Entra ID (read from the issuer). A B2C issuer needs the
      # /tfp/ path form — see backend/app/core/oidc.py.
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL}
      # Where the IdP returns the browser after logout. Point it at this
      # deployment's /logged-out (B2C rejects a logout without it, AADB2C90036).
      # DSA: register it on the Entra app registration next to the redirect URI.
      OIDC_POST_LOGOUT_REDIRECT: ${OIDC_POST_LOGOUT_REDIRECT}
      # IdP role claim values allowed to write; everyone else is read-only.
      EDIT_ROLES: ${EDIT_ROLES:-admin,user-edit}
      OIDC_SCOPES: ${OIDC_SCOPES}
      OIDC_ENVIRONMENT: ${OIDC_ENVIRONMENT}
      SESSION_SECRET: ${SESSION_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      edge:
        aliases:
          - dsa-api

  frontend:
    # Built by .github/workflows/docker-publish.yml — never on the server.
    # pull_policy always: the tag moves with each push, so `up -d` fetches it.
    image: ghcr.io/aak-mbu/dsa-sagsbehandling-frontend:${DSA_IMAGE_TAG:-develop}
    pull_policy: always
    container_name: dsa-frontend
    environment:
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
      # Browser-facing URL that starts the OIDC login flow. Defaults to the
      # same-origin /api/auth/login, which assumes the edge proxy forwards /api
      # to the backend. Set an absolute URL where it does not.
      PUBLIC_OIDC_LOGIN_URL: ${PUBLIC_OIDC_LOGIN_URL:-}
      # DSA: the marker beside the name in the top bar, so this environment is
      # never mistaken for prod. Fixed here rather than in .env: the compose
      # file is what makes a folder dev, and one image serves dev and prod.
      PUBLIC_ENVIRONMENT_LABEL: DEV
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    env_file:
      - .env
    restart: unless-stopped
    networks:
      edge:
        aliases:
          - dsa-frontend

networks:
  edge:
    external: true

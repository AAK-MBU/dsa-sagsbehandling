# Production deployment, behind the edge proxy.
#
# Identical to docker-compose_dev.yml except for the container names and the
# network aliases. Both stacks join the same external `edge` network, where a
# name can only belong to one container — reusing the dev names here would make
# the prod hostname serve the dev containers.
#
# The nginx block for mbu-dsa.adm.aarhuskommune.dk must point
# its two `set` directives at the aliases below.
#
# Selected per directory via COMPOSE_FILE in .env — see .env.example.
#
# Runs the :main image (pushes to main); dev runs :develop. DSA_IMAGE_TAG in
# .env overrides it.

services:
  api:
    # Built by .github/workflows/docker-publish.yml — never on the server.
    # pull_policy always: the tag moves with each push, so `up -d` fetches it.
    image: ghcr.io/aak-mbu/dsa-sagsbehandling-api:${DSA_IMAGE_TAG:-main}
    pull_policy: always
    container_name: dsa-prod-api
    environment:
      API_KEY: ${API_KEY}
      API_KEY_HASHES: ${API_KEY_HASHES}
      # DSA: fails closed when unset — see OIDC_ENABLED in .env.example.
      OIDC_ENABLED: ${OIDC_ENABLED:-true}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      # DSA: empty for Entra ID (read from the issuer). A B2C issuer needs the
      # /tfp/ path form — see backend/app/core/oidc.py.
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL}
      # Where the IdP returns the browser after logout. Point it at this
      # deployment's /logged-out (B2C rejects a logout without it, AADB2C90036).
      # DSA: register it on the Entra app registration next to the redirect URI.
      OIDC_POST_LOGOUT_REDIRECT: ${OIDC_POST_LOGOUT_REDIRECT}
      # IdP role claim values allowed to write; everyone else is read-only.
      EDIT_ROLES: ${EDIT_ROLES:-admin,user-edit}
      OIDC_SCOPES: ${OIDC_SCOPES}
      OIDC_ENVIRONMENT: ${OIDC_ENVIRONMENT}
      SESSION_SECRET: ${SESSION_SECRET}
    healthcheck:
      # /health/ready, not /health: /health returns a literal {"status":"ok"}
      # and touches nothing, so it cannot fail while the API is unable to serve
      # a single request. /health/ready takes a pooled connection and runs
      # SELECT 1, so pool exhaustion and an unreachable database both show up.
      # 127.0.0.1 rather than localhost, which resolves to [::1] first while the
      # server binds IPv4 — curl retries the next address, wget does not.
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      edge:
        aliases:
          - dsa-prod-api

  frontend:
    # Built by .github/workflows/docker-publish.yml — never on the server.
    # pull_policy always: the tag moves with each push, so `up -d` fetches it.
    image: ghcr.io/aak-mbu/dsa-sagsbehandling-frontend:${DSA_IMAGE_TAG:-main}
    pull_policy: always
    container_name: dsa-prod-frontend
    environment:
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
      # Browser-facing URL that starts the OIDC login flow. Defaults to the
      # same-origin /api/auth/login, which assumes the edge proxy forwards /api
      # to the backend. Set an absolute URL where it does not.
      PUBLIC_OIDC_LOGIN_URL: ${PUBLIC_OIDC_LOGIN_URL:-}
      # DSA: deliberately no PUBLIC_ENVIRONMENT_LABEL — prod shows no marker
      # beside the name; local and dev set one in their compose files.
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Two corrections, both needed. localhost resolves to [::1] first and the
      # server binds 0.0.0.0 (IPv4 only), so wget was refused at the TCP layer
      # and never reached HTTP. And "/" is behind the auth guard, which answers
      # 401 to an anonymous non-document request by design — wget --spider exits
      # non-zero on a 4xx. /health is an unguarded liveness route added for this;
      # see frontend/src/routes/health/+server.ts.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    env_file:
      - .env
    restart: unless-stopped
    networks:
      edge:
        aliases:
          - dsa-prod-frontend

networks:
  edge:
    external: true
